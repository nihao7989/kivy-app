<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>我的小工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, "Microsoft YaHei", sans-serif; 
            background: #f2f3f7; 
            padding: 16px;
            padding-top: 40px;
        }
        .card { 
            background: white; 
            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h3 { font-size: 16px; margin-bottom: 12px; color: #333; }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #e0e0e0; 
            border-radius: 10px; 
            font-size: 15px; 
            margin-bottom: 10px;
        }
        .btn { 
            width: 100%; 
            padding: 13px; 
            background: #1677ff; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            margin-bottom: 8px;
        }
        .btn:active { background: #0958d9; }
        .btn-gray { background: #f5f5f7; color: #333; }
        .row { display: flex; gap: 10px; }
        .row .btn { flex: 1; margin-bottom: 0; }
    </style>
</head>
<body>

<div class="card">
    <h3>网页视频打开器</h3>
    <input id="url" placeholder="粘贴视频链接到这里">
    <button class="btn" onclick="openVideo()">打开视频</button>
</div>

<div class="card">
    <h3>常用站点</h3>
    <div class="row">
        <button class="btn btn-gray" onclick="openSite('https://www.iqiyi.com')">爱奇艺</button>
        <button class="btn btn-gray" onclick="openSite('https://v.qq.com')">腾讯视频</button>
    </div>
    <div style="height:10px"></div>
    <div class="row">
        <button class="btn btn-gray" onclick="openSite('https://www.youku.com')">优酷</button>
        <button class="btn btn-gray" onclick="openSite('https://www.bilibili.com')">B站</button>
    </div>
</div>

<script>
function openVideo() {
    let u = document.getElementById('url').value.trim();
    if (!u) { alert('请先输入链接'); return; }
    if (!u.startsWith('http')) u = 'https://' + u;
    window.location.href = 'https://你的解析站/?url=' + u;
}
function openSite(u) {
    window.location.href = u;
}
</script>

</body>
</html>
